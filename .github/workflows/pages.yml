name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant repository read access by default; deployment gets only its extra permissions below.
permissions:
  contents: read

# Keep only the newest Pages deployment run active.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Run site tests
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Prepare site artifact
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/docs/assets"
          # Publish only the files used by the website, not repository or development files.
          cp ./*.html styles.css theme.js "$site/"
          cp docs/assets/*.png "$site/docs/assets/"
          touch "$site/.nojekyll"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
